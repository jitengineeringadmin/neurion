node:
  name: "Giacomo Home Server"
  apiUrl: "http://localhost:8091"
  nodeId: ""
  nodeKey: ""
  modes:
    - "grid"
    - "realtime"
  maxConcurrentJobs: 1
  allowGpu: true
  workingDir: "./neurion-work"
  allowedJobTypes:
    - "echo.v1"
    - "embedding.v1"
  limits:
    maxCpuPercent: 80
    maxGpuPercent: 80
    maxGpuTempC: 78
    maxPowerWatts: 450
    maxJobSeconds: 1800
    maxDiskMb: 50000
# realtime lane — serve streaming chat from a local OpenAI-compatible engine and
# earn NRN. Two common backends:
#   * ollama         -> baseUrl http://localhost:11434/v1
#   * ds4 / DwarfStar -> run `ds4-server` (antirez DeepSeek V4 engine) and point
#                        baseUrl at it, e.g. http://localhost:8080/v1
# Leave `models` empty to auto-discover from the backend's GET /models (recommended
# for ds4: it reports deepseek-v4-flash / -pro). If the backend is unreachable at
# startup the node will NOT advertise the realtime lane.
realtime:
  enabled: true
  provider: "ds4"
  baseUrl: "http://localhost:8080/v1"
  apiKey: "local-dev"
  models: []        # empty = auto-discover (ds4 reports deepseek-v4-flash)
