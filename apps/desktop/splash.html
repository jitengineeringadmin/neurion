<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #04070a; color: #00ff70;
        font-family: 'Share Tech Mono', ui-monospace, monospace; overflow: hidden; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .logo { font-size: 40px; letter-spacing: 0.18em; text-shadow: 0 0 12px rgba(0,255,112,.5); }
      .bar { width: 200px; height: 3px; background: #0f1d15; border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 40%; background: #00ff70; animation: slide 1.2s infinite; }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
      .status { font-size: 12px; color: #5f9a72; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">NEURION</div>
      <div class="bar"><i></i></div>
      <div class="status" id="s">avvio…</div>
    </div>
    <script>
      window.setStatus = (t) => { document.getElementById('s').textContent = t; };
    </script>
  </body>
</html>
