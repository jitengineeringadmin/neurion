name: Release

# Cut a release: push a tag like v1.2.0 (or run manually).
#   git tag v1.2.0 && git push origin v1.2.0
# Builds the desktop installer on Windows, Linux and macOS and attaches every
# artifact to the GitHub Release for that tag.
#
# The Go node-agent used to be built and published here too. It belongs to the
# earlier design, where a machine registered with our API and held a WebSocket
# open to it; the peer network replaced that, and publishing a worker that calls
# home would have contradicted the thing it was meant to serve. The source is
# still in apps/node-agent, unbuilt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- desktop app: native installer per OS ----------------------------------
  desktop:
    name: desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma generate
        run: pnpm --filter @neurion/api exec prisma generate

      - name: assemble runtime stack + build installer
        working-directory: apps/desktop
        env:
          # never sign / notarize in CI (mac uses identity:null; win uses rcedit only)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm run prepare-stack
          pnpm exec electron-builder --publish never

      - name: attach installers to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            apps/desktop/dist-installer/*.exe
            apps/desktop/dist-installer/*.dmg
            apps/desktop/dist-installer/*.AppImage
            apps/desktop/dist-installer/*.deb

      - name: upload installers as build artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: neurion-desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/desktop/dist-installer/*.exe
            apps/desktop/dist-installer/*.dmg
            apps/desktop/dist-installer/*.AppImage
            apps/desktop/dist-installer/*.deb
