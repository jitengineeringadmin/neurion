# Neurion reverse proxy (VPS 80.211.136.108).
upstream neurion_api { server 127.0.0.1:8091; }
upstream neurion_web { server 127.0.0.1:3091; }

server {
    listen 80;
    server_name neurion.local;

    # Node WebSocket gateway (upgrade)
    location /ws/nodes {
        proxy_pass http://neurion_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # API (REST + SSE). SSE needs buffering off.
    location /api/ {
        proxy_pass http://neurion_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://neurion_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
