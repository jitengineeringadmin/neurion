services:
  postgres:
    image: postgres:16
    container_name: neurion-postgres
    environment:
      POSTGRES_USER: neurion
      POSTGRES_PASSWORD: neurion
      POSTGRES_DB: neurion
    ports:
      - "5432:5432"
    volumes:
      - neurion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: neurion-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: neurion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neurion
      MINIO_ROOT_PASSWORD: neurion-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - neurion_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  hardhat:
    image: node:20
    container_name: neurion-hardhat
    working_dir: /contracts
    command: sh -c "corepack enable && pnpm install && pnpm hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    volumes:
      - ./packages/contracts:/contracts
    profiles: ["chain"]

  # G3: optional local AI provider for real Fallback-lane chat. `docker compose --profile ai up`.
  ollama:
    image: ollama/ollama:latest
    container_name: neurion-ollama
    ports:
      - "11434:11434"
    volumes:
      - neurion_ollama:/root/.ollama
    profiles: ["ai"]

volumes:
  neurion_postgres:
  neurion_minio:
  neurion_ollama:
